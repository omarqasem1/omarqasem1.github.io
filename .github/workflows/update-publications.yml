name: Update publications

# Every Monday at 03:00 UTC (06:00 Kuwait), and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new papers, abstracts and BibTeX
        run: python scripts/update_publications.py

      - name: Save changes
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "Nothing new this week."
            exit 0
          fi
          git config user.name "publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Weekly publication update"
          git push
